version: '3.8'

services:
  conference-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: conference-portal:1.0.0-mvp
    container_name: conference-portal-app
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - conference-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: conference-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      conference-app:
        condition: service_healthy
    networks:
      - conference-net

networks:
  conference-net:
    driver: bridge


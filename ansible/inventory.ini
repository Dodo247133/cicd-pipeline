# Ansible Inventory for Conference Registration Portal Infrastructure
[webservers]
target-node-01 ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[loadbalancers]
lb-node-01 ansible_host=192.168.56.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[production:children]
webservers
loadbalancers

[production:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=conference-portal
app_version=1.0.0-mvp
deploy_dir=/opt/conference-portal
service_user=deployer
service_group=deployer
http_port=8080
proxy_port=80
ssl_port=443
